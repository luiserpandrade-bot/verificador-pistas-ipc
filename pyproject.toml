[project]
name = "verificador-pistas-ipc"
version = "0.1.0"
description = "Verificador de pistas de PCB segun IPC-2221 (API REST + servidor MCP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    # Versiones fijadas a proposito: passlib 1.7.4 lee bcrypt.__about__.__version__,
    # atributo eliminado en bcrypt 4.1. El par 1.7.4 + 4.0.1 es el que funciona.
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose>=3.3,<4",
    # Paquete MCP fijado: FastMCP introdujo cambios incompatibles entre 2.x, 3.x y 4.x.
    "fastmcp==4.0.5",
    "email-validator>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
# Articulo VII.3: el umbral global no exige cubrir el arranque de la app, el
# servidor MCP ni la configuracion de logging. La exclusion se declara aqui de
# forma explicita, nunca como una omision silenciosa.
omit = [
    "app/main.py",
    "app/mcp/server.py",
    "app/mcp/auth.py",
    "app/logging_config.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

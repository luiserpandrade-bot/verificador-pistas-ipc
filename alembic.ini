[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.20 avisa de que el troceo antiguo de rutas (por espacios, comas y dos
# puntos) queda obsoleto. Se fija el separador del sistema operativo de forma
# explicita para no depender del comportamiento heredado.
path_separator = os

# La URL de conexion NO se escribe aqui: este archivo se versiona y el Articulo IV.3
# prohibe que DATABASE_URL viva fuera de .env. env.py la toma de app/config.py, y los
# tests la sobrescriben con set_main_option.
sqlalchemy.url =

[post_write_hooks]
